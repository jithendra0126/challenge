<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cricket Scorecard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tfoot {
            background-color: #eee;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>India vs Australia - Scorecard</h1>

    <h2>India Innings</h2>
    <table>
        <thead>
            <tr>
                <th>Batsman</th>
                <th>Runs</th>
                <th>Balls</th>
                <th>4s</th>
                <th>6s</th>
                <th>Strike Rate</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rohit Sharma</td>
                <td>45</td>
                <td>32</td>
                <td>6</td>
                <td>1</td>
                <td>140.6</td>
            </tr>
            <tr>
                <td>Virat Kohli</td>
                <td>63</td>
                <td>47</td>
                <td>7</td>
                <td>0</td>
                <td>134.0</td>
            </tr>
            <tr>
                <td>Suryakumar Yadav</td>
                <td>28</td>
                <td>16</td>
                <td>3</td>
                <td>2</td>
                <td>175.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan="5">164/3 in 20 overs</td>
            </tr>
            <tr>
                <td>Extras</td>
                <td colspan="5">12 (5 wides, 7 leg byes)</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
